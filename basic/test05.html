<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        let x = 90;
        let y = 60;
        let z = 45;

        let time = 1;

        while(true) {
            if (time % x === 0 && time % y === 0 && time % z === 0) {
                break ;
            }
            time++;
        }
        document.write("<운동장 한바퀴 도는 소요시간>" + "<br>");
        document.write("철수 : 90초" + "<br>" + "영희 : 60초" +"<br>" + "민수 : 45초" +"<br>")

        let min = time / 60;
        document.write("8시 출발 후 다시 만나는 시간 : 8시 " + min + "분 <br>")

        document.write("8시" + min + "분에" + "철수는" + (time / x) + "바퀴를 뛰었음" + "<br>")
        document.write("8시" + min + "분에" + "영희는" + (time / y) + "바퀴를 뛰었음" + "<br>")
        document.write("8시" + min + "분에" + "민수는" + (time / z) + "바퀴를 뛰었음" + "<br>")

    </script>
</head>
<body>
    
</body>
</html>

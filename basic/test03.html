<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        document.write("<hr><1 ~ 50 숫자 중 십의 자리 짝수면서 일의 자리 홀수고, 3의 배수인 숫자 출력></h3>" + "<br>")

        let count = 0;    

        for (let i = 10; i <= 50; i++) {
            let ten = parseInt(i / 10);
            let one = i % 10;

            switch (true) {
                case (ten % 2 === 0 && one % 2 !== 0 && i % 3 === 0):
                    document.write (i + " ");
                    count++;
                    break;
            }
        }
        document.write("<br>총 개수 : " + count + "개")

    </script>
</head>
<body>
    
</body>
</html>

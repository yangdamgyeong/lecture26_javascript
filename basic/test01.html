<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        let num = parseInt(prompt("정수를 입력하세요 : "));
        if (num >= 1 && num <= 50){
            document.write("<strong>" + "<" + "1 ~ " + num + "사이의 정수값을 한 라인에 5개씩 출력하기" + ">"  + "</strong>" + "<br>");
            for (let i = 1; i <= num; i ++){
                document.write(i + " ");
                if (i % 5 === 0){
                    document.write("<br>");
                }
            }
            document.write("<br>" + "<strong>" + "<" + num + "의 약수 출력" + ">" + "</strong>" + "<br>")
            let count = 0

            for (let i = 1; i <= num; i++){
                if (num % i === 0) {
                    document.write(i + " ");
                    count++;
                }
            }
            document.write("<br>" + "약수의 총 개수 : " + count);
        } else {
            alert("1에서 50 사이의 숫자만 입력 가능합니다.");
        }

    </script>
</head>
<body>
    
</body>
</html>

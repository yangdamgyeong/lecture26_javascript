<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        document.write ("<100-200 숫자 중 자리수가 4이고, 6개의 배수 출력>" + "<br>")
        let count = 0; 

        for (let i = 100; i <= 200; i++ ){
            let hun = parseInt(i / 100);
            let ten = parseInt((i % 100) / 10);
            let one = i % 10;

            switch (true) {
                case (( hun === 4 || ten === 4 || one === 4) && ( i % 6 === 0)):
                    document.write(i + " ");
                    count++;
                    break;
            }
        }

        document.write("<br>총 개수 : " + count + "개")

    </script>
</head>

</body>
</html>
